<html lang="ar" dir="rtl" class="ld"><head><meta charset="utf-8">

<title>Dinfil — الموقع الرسمي</title>
<meta name="description" content="الموقع الرسمي لـ Dinfil — بث مباشر على Kick، شخصيات FiveM، ومعرض صور.">

<style>
:root{--bg:#060606;--card:#0f0f14;--line:#24242c;--tx:#f2f2f5;--mu:#9a9aa8;--red:#ff1e2d;--hb:none}
html.ld body{visibility:hidden;animation:ldf 0s 1.8s forwards}@keyframes ldf{to{visibility:visible}}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--red);outline-offset:2px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 5%;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;background:#060606d9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:9}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 16px color-mix(in srgb,var(--red) 50%,transparent)}
.brand small{display:block;color:var(--red);font-size:10px;letter-spacing:2px;line-height:1}
.links{display:flex;gap:20px;color:var(--mu);font-weight:700;font-size:14px}.links a:hover{color:var(--tx)}
@media(max-width:760px){.links{display:none}}
.btn{display:inline-block;padding:10px 22px;border-radius:8px;font-weight:700;background:var(--red);color:#fff;border:0;font-family:inherit;font-size:15px;cursor:pointer;box-shadow:0 0 22px color-mix(in srgb,var(--red) 35%,transparent)}
.btn.o{background:transparent;border:1px solid var(--red);box-shadow:none}.btn.s{padding:6px 14px;font-size:13px;box-shadow:none}
.hero{text-align:center;padding:80px 5% 60px;background:linear-gradient(#060606aa,#060606),var(--hb) center/cover}
.hero>img{display:block;margin:0 auto 12px;width:130px;height:130px;border-radius:50%;object-fit:cover;box-shadow:0 0 50px color-mix(in srgb,var(--red) 55%,transparent)}
.hero h1{font-size:clamp(44px,10vw,92px);margin:14px 0 0;font-weight:900;line-height:1}
.tag{letter-spacing:4px;color:var(--mu);direction:ltr;margin:10px 0}
.hero p{color:var(--mu);max-width:600px;margin:8px auto 18px}.hero .btn{margin:6px}
.emo{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0}
.emo a{display:flex;align-items:center;font-size:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.emo a:hover{border-color:var(--red)}.emo img{width:30px;height:30px;object-fit:contain}
main{max-width:1150px;margin:auto;padding:20px 5%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:22px;margin:38px 0 14px;border-right:4px solid var(--red);padding-right:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats b{display:block;font-size:26px;color:var(--red)}.stats span{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:900px){.grid{grid-template-columns:2fr 1fr}}
.player{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000}.chat{min-height:200px;display:flex;align-items:center;justify-content:center}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.ch{border-top:3px solid var(--red)}.ch b{font-size:19px}.ch em{display:block;color:var(--red);font-style:normal;margin:4px 0}.ch p{color:var(--mu);margin:6px 0 0;font-size:14px}.ch img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;margin-bottom:12px}
.lv{display:table;margin:10px auto;padding:4px 14px;border:1px solid var(--red);border-radius:99px;font-size:13px;color:var(--red)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.gg figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.gg img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.gg figcaption{padding:10px;text-align:center;font-weight:700}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.tops h3{margin:0 0 10px;color:var(--red);font-size:16px}
.rk{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.rk i{color:var(--mu);font-style:normal}
.lk{display:block;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.lk:hover,.soc a:hover{border-color:var(--red)}.lk small{display:block;color:var(--mu);margin-top:4px}
.soc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.soc a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:700}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px 0}
.tags span{display:flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:99px;background:color-mix(in srgb,var(--red) 12%,#000);font-size:13px;font-weight:700;color:#f3c4c8}
.tags i{color:var(--red);font-style:normal;font-size:9px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:22px 0}
.cb{display:flex;align-items:center;justify-content:center;gap:14px;min-width:220px;padding:18px 26px;border-radius:14px;font-weight:900;font-size:18px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:linear-gradient(#3a0509,#1a0204);color:#ff9aa2}
.cb.g{border-color:#ffffff40;background:#ffffff14;color:#fff}
.pb{width:40px;height:40px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 25%,transparent),0 0 18px var(--red)}
.hs{display:flex;max-width:960px;margin:26px auto 0;border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:22px;background:linear-gradient(#2a0408,#0a0102);overflow:hidden}
.hs>div{flex:1;padding:22px 10px;text-align:center}.hs>div+div{border-right:1px solid color-mix(in srgb,var(--red) 25%,transparent)}
.hs b{display:block;font-size:clamp(30px,6vw,46px);font-weight:900}.hs span{color:#b36a70;font-size:13px}
.msg{color:var(--mu);font-size:14px}
footer{text-align:center;color:var(--mu);padding:40px 5%;border-top:1px solid var(--line);margin-top:40px;font-size:14px}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 12px;font-family:inherit;font-size:14px}
input[type=checkbox]{width:auto}select{background:#000;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:14px}
.row input[type=color]{flex:0 0 56px;min-width:56px}.pv{padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center;font-size:42px;font-weight:900;line-height:1.2;margin:8px 0;overflow:hidden}input[type=color]{height:40px;padding:2px}

.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:12px 0;background:var(--card);border-bottom:1px solid var(--line)}.sp{flex:1}
.f{display:block;margin:8px 0;font-size:13px;color:var(--mu)}.f input{margin-top:4px}
.row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.row .btn{flex:0 0 auto;min-width:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 22px;border-radius:99px;font-weight:700;z-index:999}
